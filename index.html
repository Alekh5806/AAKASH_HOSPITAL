<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- White, to merge with the white header where a browser honours it. Chrome
         for Android ignores this in dark mode and paints its own dark toolbar;
         the header is built to sit under either. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- The opening curtain: the hospital's logo on paper, which opens like an
         eyelid onto the page once it is ready. It is static HTML so it paints
         before any script; vite.config.js fills in its stylesheet
         (src/styles/preloader.css), the split logo and the tagline.
         AppPreloader takes it over once React runs. The inline script stamps
         the curtain's clock and hides it when this session has already seen
         it. -->
    <style>
      %PL_CSS%
    </style>
    <noscript>
      <style>
        #app-intro,
        #app-wait {
          display: none;
        }
        /* The prerendered page without JavaScript: anything waiting for its
           entrance animation is simply shown. */
        #root [style*="opacity:0"] {
          opacity: 1 !important;
        }
        #root [style*="clip-path"] {
          clip-path: none !important;
        }
      </style>
    </noscript>
    <script>
      window.__aakashIntroStart = performance.now();
      try {
        if (sessionStorage.getItem("aakash_intro_seen") === "true") {
          document.documentElement.classList.add("intro-seen");
        }
      } catch (error) {}
    </script>
    <!-- The site's own fonts (src/styles/fonts.css, inlined by vite.config.js):
         no third-party request, and the two faces the first screen sets - the
         serif of the headlines and the curtain's tagline, and Inter for the
         body - start loading with the HTML. -->
    <style>
      %FONT_CSS%
    </style>
    <link rel="preload" href="/assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <!-- The page's own title, description, canonical, social tags and the
         preload for its first picture: scripts/prerender.mjs writes them in
         for every page at build time, and SEO.jsx keeps them current as the
         reader moves between pages. -->
    <!--app-head-->
  </head>
  <body>
    <div id="app-intro" class="pl" role="status" aria-label="%PL_NAME_LABEL% is opening">
      <div class="pl__shade pl__shade--top"></div>
      <div class="pl__shade pl__shade--bottom"></div>
      <div class="pl__lid pl__lid--top"></div>
      <div class="pl__lid pl__lid--bottom"></div>
      <div class="pl__brand" style="aspect-ratio: %PL_RATIO%" aria-hidden="true">
        <span class="pl__mark" style="aspect-ratio: %PL_MARK_RATIO%; background: %PL_MARK_FILL%">
          <svg viewBox="%PL_MARK_BOX%" focusable="false">%PL_MARK%</svg>
        </span>
        <span class="pl__name">
          <svg viewBox="%PL_NAME_BOX%" focusable="false">%PL_NAME%</svg>
        </span>
      </div>
      <span class="pl__seam" aria-hidden="true"></span>
      <div class="pl__foot">
        <p class="pl__line">%BRAND_TAGLINE_LEAD% <em>%BRAND_TAGLINE_SINCE%</em></p>
      </div>
      <!-- The line between the logo and the tagline fills as the page really
           loads; this script owns its first two steps (the frame is up, the
           serif has arrived) and AppPreloader the rest. The tagline rises
           once the serif has loaded, never in a fallback face, and not
           before the name has begun to arrive. -->
      <script>
        (function () {
          var html = document.documentElement;
          var frame = document.getElementById("app-intro");
          var start = window.__aakashIntroStart;
          function step(value, ms) {
            if (value <= (parseFloat(frame.style.getPropertyValue("--pl-p")) || 0)) return;
            frame.style.setProperty("--pl-pt", ms + "ms");
            frame.style.setProperty("--pl-p", String(value));
          }
          setTimeout(function () {
            step(0.3, 1400);
          }, 380);
          var done = false;
          function ready() {
            if (done) return;
            done = true;
            var elapsed = performance.now() - start;
            html.style.setProperty("--pl-line-at", Math.max(0, Math.round(560 - elapsed)) + "ms");
            html.classList.add("pl-ready");
            setTimeout(
              function () {
                step(0.52, 2400);
              },
              Math.max(0, 420 - elapsed),
            );
          }
          if (document.fonts && document.fonts.load) {
            Promise.all([
              document.fonts.load('400 1em "Source Serif 4"'),
              document.fonts.load('italic 400 1em "Source Serif 4"'),
            ]).then(ready, ready);
          }
          setTimeout(ready, 1500);
        })();
      </script>
    </div>
    <!-- A reload later in the visit, when the curtain is not shown: paper over
         the prerendered page until React has rendered it, so nothing flashes
         between the static copy and the app. Only a slow load sees the logo
         (preloader.css); AppPreloader removes it on mount. -->
    <div id="app-wait" class="pl pl--wait" aria-hidden="true">
      <img class="pl__logo" src="%BRAND_LOGO%" alt="" width="207" height="50" />
      <div class="pl__foot">
        <p class="pl__line">%BRAND_TAGLINE_LEAD% <em>%BRAND_TAGLINE_SINCE%</em></p>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
